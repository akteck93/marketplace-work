services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - workiffy_mongo:/data/db
    networks:
      - workiffy

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      TRUST_PROXY: 1
      MONGODB_URI: mongodb://mongo:27017/workiffy
      JWT_SECRET: change-this-to-a-long-random-secret-before-use
      ENFORCE_SUBSCRIPTIONS: "false"
    ports:
      - "3000:3000"
    networks:
      - workiffy

volumes:
  workiffy_mongo:

networks:
  workiffy:
